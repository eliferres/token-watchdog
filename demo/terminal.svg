<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 856" role="img" aria-labelledby="t d" font-family="SF Mono, Menlo, Consolas, monospace" font-size="16" xml:space="preserve">
  <title id="t">token-watchdog auditing three days of Claude Code logs</title>
  <desc id="d">token-watchdog reads three days of synthetic Claude Code session logs, raises four flags across three sessions, notes one malformed line it skipped, and exits 1.</desc>
  <style>
    text { white-space: pre; }
    .p { fill: #7ee2a8; }
    .cmd { fill: #e8eef5; }
    .dim { fill: #9fb0c0; }
    .bad { fill: #ff9494; }
    .good { fill: #7ee2a8; }
  </style>
  <rect width="660" height="856" rx="14" fill="#0b0f14"/>
  <rect width="660" height="40" rx="14" fill="#11161d"/>
  <rect y="26" width="660" height="14" fill="#11161d"/>
  <circle cx="26" cy="20" r="6" fill="#ff5f57"/>
  <circle cx="48" cy="20" r="6" fill="#febc2e"/>
  <circle cx="70" cy="20" r="6" fill="#28c840"/>
  <text x="92" y="26" class="dim" font-size="14">token-watchdog auditing three days of Claude Code logs</text>
  <text x="24" y="72"><tspan class="p">$</tspan><tspan class="cmd" dx="8">python3 -m token_watchdog --projects-dir demo/projects \</tspan></text>
  <text x="24" y="100" class="cmd">    --now 2026-09-30 --days 3 --top 2; echo &quot;exit $?&quot;</text>
  <text x="24" y="128" class="dim">token-watchdog: 3 days to 2026-09-30, 3 projects, 6 session…</text>
  <text x="24" y="156" class="good">weighted 9.7M input-equivalent (fresh 31k, cache write 1.7M…</text>
  <text x="24" y="184" class="dim">cache hit 97%, subagents 0% of the weighted total</text>
  <text x="24" y="212" class="dim">by project</text>
  <text x="24" y="240" class="dim">     5.8M   59%  billing-api    2 sessions</text>
  <text x="24" y="268" class="dim">     2.4M   24%  infra-scripts  2 sessions</text>
  <text x="24" y="296" class="dim">     1.5M   15%  docs-site      2 sessions</text>
  <text x="24" y="324" class="dim">by day</text>
  <text x="24" y="352" class="dim">  2026-09-28 Mon     3.4M  ##############</text>
  <text x="24" y="380" class="dim">  2026-09-29 Tue     4.8M  ####################</text>
  <text x="24" y="408" class="dim">  2026-09-30 Wed     1.6M  #######</text>
  <text x="24" y="436" class="dim">top sessions (2 of 6)</text>
  <text x="24" y="464" class="dim">     4.5M   46%  billing-api    7be41d09   200 calls  hit…</text>
  <text x="24" y="492" class="dim">     1.3M   13%  billing-api    f2c8a710    80 calls  hit…</text>
  <text x="24" y="520" class="dim">flags</text>
  <text x="24" y="548" class="dim">  low-cache-hit  docs-site c81d5e44</text>
  <text x="24" y="576" class="dim">                 56% of input came from cache, below 80%</text>
  <text x="24" y="604" class="dim">  reread-heavy   billing-api 7be41d09</text>
  <text x="24" y="632" class="dim">                 each cached token was read back 201 times,…</text>
  <text x="24" y="660" class="dim">  outsized-turn  infra-scripts e09b6d12</text>
  <text x="24" y="688" class="dim">                 one call weighed 533k, over 500k, 47% of i…</text>
  <text x="24" y="716" class="dim">  session-share  billing-api 7be41d09</text>
  <text x="24" y="744" class="dim">                 46% of the window's weighted total, over 2…</text>
  <text x="24" y="772" class="dim">skipped 1 malformed line in 1 file</text>
  <text x="24" y="800" class="dim">FLAGGED: 4 flags in 3 sessions</text>
  <text x="24" y="828" class="bad">exit 1</text>
</svg>